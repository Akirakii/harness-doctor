<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Doctor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EC;--card:#FFFFFF;--ink:#2B2A33;--soft:#8C8897;--line:#F0E5D4;--coral:#F2545B;--coral-bg:#FFE2DF;--blue:#3B82E0;--blue-bg:#DCEAFF;--green:#1F9D6B;--green-bg:#DDF5EA;--purple:#8B5CF6;--yellow:#E8A800;--orange:#E2741F;--orange-bg:#FFE8D4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16141D;--card:#211E2B;--ink:#F5F2FA;--soft:#A6A1B5;--line:#302C3D;--coral:#FF6B70;--coral-bg:#3A2030;--blue:#5DA5F2;--blue-bg:#1D2C45;--green:#3DD39A;--green-bg:#173A2D;--purple:#A78BFA;--yellow:#F5C542;--orange:#FF9A4D;--orange-bg:#3A2A1C}}
:root[data-theme="dark"]{--bg:#16141D;--card:#211E2B;--ink:#F5F2FA;--soft:#A6A1B5;--line:#302C3D;--coral:#FF6B70;--coral-bg:#3A2030;--blue:#5DA5F2;--blue-bg:#1D2C45;--green:#3DD39A;--green-bg:#173A2D;--purple:#A78BFA;--yellow:#F5C542;--orange:#FF9A4D;--orange-bg:#3A2A1C}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Nunito,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:32px 16px 110px}
h1{font:700 42px/1.05 Fredoka,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 22px}
.pill{font:700 15px Nunito,system-ui,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.pill:disabled{opacity:.5;cursor:default}
.pill[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue-bg);color:var(--blue)}
.pill[aria-pressed="false"]{color:var(--soft)}
.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#msg{color:var(--soft);font-size:15px;flex-basis:100%}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:190px}
.spin{width:16px;height:16px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none;border-right-color:currentColor;opacity:.5}}
.cards{display:grid;gap:12px}
.group{font:600 14px Fredoka,system-ui,sans-serif;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;margin:10px 4px 0}
.card{position:relative;overflow:hidden;background:var(--card);border-radius:24px;padding:16px 20px 16px 26px;display:grid;grid-template-columns:minmax(140px,auto) minmax(0,1fr) auto;gap:4px 12px;align-items:center;box-shadow:0 3px 0 var(--line);cursor:pointer;transition:transform .12s ease}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:color-mix(in srgb,var(--kind) 65%,var(--card))}
.card.k-rules{--kind:var(--blue)}.card.k-style{--kind:var(--purple)}.card.k-skill{--kind:var(--yellow)}
.card:hover{transform:translateY(-2px)}
.card.idle{box-shadow:none;background:transparent;outline:2px dashed var(--line);outline-offset:-2px}
.card.idle>:not(.more),.card.idle::before{opacity:.55}
.nm{font:600 23px/1.2 Fredoka,system-ui,sans-serif;overflow-wrap:anywhere}
.sub{color:var(--soft);font-size:14px;overflow-wrap:anywhere}
.sub .kp{position:relative;cursor:copy}
.sub .kp .path{position:absolute;left:-8px;top:-4px;z-index:2;padding:3px 8px;border-radius:8px;background:var(--card);color:var(--ink);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .12s}
.sub .kp:hover .path{opacity:1;pointer-events:auto}
.sub .kp .path.done{color:var(--green);font-weight:700}
.xs{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:0;padding:4px;margin:-4px;user-select:none;--fl:0px;--fr:0px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.xs::-webkit-scrollbar{display:none}
.xs>:first-child{margin-left:auto}
.xs.scrolls{cursor:grab}.xs.dragging{cursor:grabbing}
.x,.ok,.miss{position:relative;flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:700 19px/1 Fredoka,system-ui,sans-serif;cursor:default;transition:transform .1s ease}
.x{background:var(--coral-bg);color:var(--coral)}
.ok{background:var(--green-bg);color:var(--green)}
.miss{background:var(--orange-bg);color:var(--orange)}
.x:hover,.ok:hover,.miss:hover{transform:scale(1.08)}
.vdiff{grid-column:1/-1;border-top:2px dashed var(--line);margin-top:10px;padding-top:12px;cursor:auto}
.vdiff h3{font:600 16px Fredoka,system-ui,sans-serif;margin:0}
#tip{position:fixed;z-index:10;max-width:440px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;pointer-events:none}
#tip .thead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:4px}
#tip b{font:600 21px/1.2 Fredoka,system-ui,sans-serif;color:var(--coral)}
#tip b.okc{color:var(--green)}
#tip b.missc{color:var(--orange)}
#tip .tdate{color:var(--soft);font-size:13px;white-space:nowrap}
#tip .say{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:13px;line-height:1.4}
#tip .who{display:block;font:600 12px Fredoka,system-ui,sans-serif;color:var(--soft);margin-bottom:2px}
#tip mark{background:var(--coral-bg);color:var(--coral);font-weight:700;border-radius:5px;padding:0 3px}
#tip .meta{margin-top:6px}
#tip .ihead{margin-top:8px;font-weight:700}
.more{grid-column:1/-1;border-top:2px dashed var(--line);margin-top:10px;padding-top:14px;display:grid;gap:18px;cursor:auto}
.more h3{font:600 16px Fredoka,system-ui,sans-serif;margin:0}
.more ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.meta{color:var(--soft);font-size:13px}
.fhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.fhead .pill{font-size:14px;padding:6px 14px}
.pbox{background:var(--bg);border-radius:14px;padding:12px 14px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;cursor:text}
.mini{font:700 13px Nunito,system-ui,sans-serif;color:var(--blue);background:var(--blue-bg);border:none;border-radius:999px;padding:5px 12px;cursor:pointer}
.mini:disabled{opacity:.6;cursor:default}
.ctx{position:fixed;z-index:20;max-width:min(640px,calc(100vw - 16px));background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.ctx button{display:block;width:100%;text-align:left;font:700 14px Nunito,system-ui,sans-serif;color:var(--ink);background:transparent;border:none;border-radius:10px;padding:8px 12px;cursor:pointer}
.ctx button:hover,.ctx button:focus-visible{background:var(--bg);outline:none}
.ctx .q{display:block;margin-top:6px;color:var(--ink);font-weight:400;max-height:min(320px,60vh);overscroll-behavior:contain;cursor:pointer}
.still *,.still *::before,.still *::after{transition:none!important}
pre{margin:0;max-height:320px;overflow:auto;background:var(--bg);border-radius:14px;padding:10px 12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
pre .a{color:#1F9D6B;display:block}pre .d{color:var(--coral);display:block}pre .h{color:var(--soft);display:block}
pre.clamp{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
pre.tall{max-height:65vh}
.md{background:var(--bg);border-radius:14px;padding:12px 18px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.md.tall{max-height:65vh;overflow:auto}
.md.clamp{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.md h2,.md h3,.md h4,.md h5,.md h6{font:600 17px/1.3 Fredoka,system-ui,sans-serif;margin:16px 0 6px}
.md h2{font-size:21px}.md h3{font-size:18px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md li{margin:3px 0}
.md code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);border-radius:6px;padding:1px 5px}
.md pre{background:var(--card);margin:8px 0;max-height:none}
.md table{border-collapse:collapse;margin:8px 0;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--soft)}
.md hr{border:none;border-top:2px dashed var(--line);margin:12px 0}
.md a{color:var(--blue)}
.md .fm{font-size:13px;color:var(--soft);border-bottom:2px dashed var(--line);padding-bottom:8px;margin-bottom:6px}
.md .fm b{color:var(--ink)}
.quiet{color:var(--soft);font-size:15px;margin:6px 4px}
.empty{color:var(--soft);font-size:18px;text-align:center;padding:56px 16px;border:2px dashed var(--line);border-radius:18px}
.empty b{color:var(--ink)}
.card.k-gaps{--kind:var(--coral)}
.vsq{flex:none;width:38px;height:44px;margin-left:6px;border:none;border-radius:10px;background:transparent;color:var(--soft);font:700 15px Fredoka,system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;position:relative;transition:background .12s,color .12s}
.vsq:hover,.vsq:focus-visible{background:var(--bg);color:var(--ink);outline:none}
.vsq .car{position:absolute;left:50%;transform:translateX(-50%);font-size:7px;padding:2px 10px;opacity:.35;cursor:pointer;transition:opacity .15s}
.vsq .car.up{top:2px}.vsq .car.down{bottom:2px}
.vsq:hover .car,.vsq:focus-visible .car{opacity:.7}
.vsq .car:hover{opacity:1}
.vsq .car.dim,.vsq:hover .car.dim{opacity:0;cursor:default}
.vsq.old{color:var(--kind)}
.vsq.on{background:color-mix(in srgb,var(--kind) 22%,transparent);color:var(--ink)}
.vseg{position:relative}
.vseg.sel .x,.vseg.sel .ok{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ink) 28%,transparent)}
.vseg.sel .vnone{border-color:color-mix(in srgb,var(--ink) 28%,transparent)}
.vseg{flex:none;display:flex;align-items:center;gap:8px}
.vseg.old{padding-left:19px}
.vseg.old::before{content:"";position:absolute;left:4px;top:50%;width:3px;height:20px;margin-top:-10px;border-radius:3px;background:color-mix(in srgb,var(--soft) 35%,transparent)}
.vnone{flex:none;width:40px;height:40px;box-sizing:border-box;border-radius:13px;border:2px dashed var(--line)}

.tabrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:-6px 0 16px}
.tabs{display:flex;gap:6px}
.tabrow .pill{font-size:14px;padding:6px 14px}
.tab{font:600 18px Fredoka,system-ui,sans-serif;color:var(--soft);background:transparent;border:none;border-radius:999px;padding:8px 18px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tab .cnt{font:700 13px Nunito,system-ui,sans-serif;background:var(--coral-bg);color:var(--coral);border-radius:999px;padding:2px 9px}
#msg .stale{color:var(--coral);font-weight:700}
#stale{background:var(--orange-bg);border-radius:14px;padding:14px 18px;margin:-8px 0 22px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
#stale[hidden]{display:none}
#stale b{color:var(--orange);font-size:16px}
#stale .why{color:var(--soft);font-size:14px;grid-column:1}
#stale .again{grid-column:2;grid-row:1/3;font:700 15px Nunito,system-ui,sans-serif;color:var(--orange);background:var(--card);border:2px solid var(--orange);border-radius:999px;padding:7px 16px;cursor:pointer}
#stale .again:disabled{opacity:.6;cursor:default}
#stale .mini{grid-column:1;justify-self:start;margin-top:6px;color:var(--orange);background:var(--card)}
#stale pre{grid-column:1/-1;margin-top:8px;background:var(--card)}
@media (max-width:600px){#stale{grid-template-columns:1fr}#stale .again{grid-column:1;grid-row:auto;justify-self:start;margin-top:6px}}
@media (max-width:600px){h1{font-size:34px}.card{grid-template-columns:1fr auto}.xs{grid-column:1/-1;grid-row:2;justify-content:flex-start}.xs>:first-child{margin-left:0}}
</style>
</head>
<body>
<main>
  <h1>Harness doctor</h1>
  <div class="bar">
    <select class="pill" id="scope" aria-label="Project"></select>
    <button class="pill" id="refresh" type="button" aria-label="Refresh">↻</button>
    <button class="pill go" id="doctor" type="button">Judge new sessions</button>
    <button class="pill" id="theme" type="button"></button>
    <span id="msg" role="status"></span>
  </div>
  <div id="stale" hidden></div>
  <div class="tabrow" id="tabrow" hidden>
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="pill" id="unused" type="button" aria-pressed="true">Unused skills shown</button>
  </div>
  <section class="cards" id="cards"></section>
</main>
<div id="ctx" class="ctx" role="menu" hidden></div>
<div id="tip" hidden></div>
<script>
(function () {
  const FR = {misunderstood_request: "misread request", wrong_approach: "wrong approach", buggy_code: "buggy code", excessive_changes: "did too much"};
  const ORDER = {"rules": 0, "output style": 1, "skill": 2};
  const KIND_CLASS = {"rules": "k-rules", "output style": "k-style", "skill": "k-skill"};  // blue, purple, yellow stripe
  const $ = id => document.getElementById(id);
  let D = null, scope = "global", showUnused = true, tab = "files";  // tab: "files" (a card per file) or "problems"
  const open = new Set(), showFile = new Set(), grown = new Set();
  try {
    showUnused = localStorage.getItem("showUnused") !== "0"; scope = localStorage.getItem("scope") || "global";
    tab = localStorage.getItem("tab") === "problems" ? "problems" : "files";
  } catch (e) {}

  const day = ms => new Date(ms).toLocaleDateString(undefined, {month: "short", day: "numeric"});
  function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

  // ---------- what's in view ----------
  const inScope = s => scope === "global" || s.cwd === scope || s.cwd.startsWith(scope + "/");
  const projectRows = () => D.rows.filter(r => r.scope !== "global" && (scope === r.scope || scope.startsWith(r.scope + "/")));
  const globalRows = () => D.rows.filter(r => r.scope === "global");
  // A version is one session's batch of edits; the latest one is what gets judged.
  const latestOf = r => r.clusters[r.clusters.length - 1];
  const since = r => latestOf(r) ? Date.parse(latestOf(r).end) : D.from;
  // CLAUDE.md and the output style touch every session; a skill only the sessions that loaded it.
  const affected = (r, s) => r.kind !== "skill" || (s.skills || []).some(u => u.name === r.name);
  // Sessions too short to judge (under 3 messages, like a lone slash command) don't count.
  const commandOnly = s => s.n < 3;
  function sessionsUsing(r, from, to = Infinity) {
    return D.sessions.filter(s => inScope(s) && !commandOnly(s) && (r.kind === "skill"
      ? (s.skills || []).some(u => u.name === r.name && Date.parse(u.t) >= from && Date.parse(u.t) < to)
      : s.ms >= from && s.ms < to));
  }
  // Version k of a file is in force from the end of its edits until the next version's edits start.
  function windowOf(r, k) {
    const cl = r.clusters;
    if (!cl.length) return {from: D.from, to: Infinity};
    return {from: Date.parse(cl[k].end), to: k + 1 < cl.length ? Date.parse(cl[k + 1].start) : Infinity};
  }

  // ---------- what the doctor said ----------
  // Per file: the triage verdict for each usage.
  // One verdict per usage: CLAUDE.md and an output style are used once per session, a skill once per load
  // ("use" 1, 2, … in load order). Returns [session id, verdict, use] for each usage.
  const loadTimes = (r, s) => (s.skills || []).filter(u => u.name === r.name).map(u => Date.parse(u.t)).sort((a, b) => a - b);
  const usageTime = (r, s, use) => r.kind === "skill" ? (loadTimes(r, s)[use - 1] || s.ms) : s.ms;
  function verdicts(r, k = r.clusters.length - 1) {
    const out = new Map(), put = (sid, use, vd) => out.set(sid + "|" + use, [sid, vd, use]);
    for (const [sid, files] of Object.entries(D.triage || {})) for (const f of files) if (f.file === r.id) put(sid, f.use || 1, Object.assign({doctor: false}, f));
    // A skill load the triage saw but blamed for nothing was a good use.
    if (r.kind === "skill") for (const sid of Object.keys(D.triage || {})) {
      const s = D.byId.get(sid);
      if (s) loadTimes(r, s).forEach((_, i) => { if (!out.has(sid + "|" + (i + 1))) put(sid, i + 1, {doctor: false, verdict: "worked", line: "Loaded, and no issue traced back to it."}); });
    }
    return [...out.values()];
  }
  const issuesOf = vd => (vd.issues || []).length ? vd.issues : [{type: "issue", line: vd.line}];
  // "missed": a skill that existed but didn't load when its job came up (the re-check found it).
  const verdictOf = (r, vd) => vd.verdict === "failed" ? "failed" : vd.verdict === "missed" && r.kind === "skill" ? "missed" : r.kind === "skill" || vd.verdict === "worked" ? "worked" : "none";
  // Good (✓), bad (✕) and missed (○) usages for version k.
  function counts(r, k) {
    const {from, to} = windowOf(r, k);
    let x = 0, ok = 0, miss = 0;
    for (const [sid, vd, use] of verdicts(r, k)) {
      const s = D.byId.get(sid), v = verdictOf(r, vd), ms = s && usageTime(r, s, use);
      if (!s || !inScope(s) || ms < from || ms >= to) continue;
      if (v === "worked") ok++;
      if (v === "failed") x += issuesOf(vd).length;  // counted per issue, like the tiles
      if (v === "missed") miss += issuesOf(vd).length;
    }
    return {x, ok, miss};
  }

  // ---------- hover card ----------
  const tip = $("tip");
  function placeTip(e) {
    const w = tip.offsetWidth, ht = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 16;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y + ht > innerHeight - 8) y = e.clientY - ht - 14;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  }
  // Highlight only the words the harness doctor marked in a quote.
  function marked(text, marks) {
    const frag = document.createDocumentFragment(), keys = (marks || []).filter(m => m && text.includes(m));
    if (!keys.length) { frag.append(text); return frag; }
    const esc = keys.sort((a, b) => b.length - a.length).map(m => m.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    text.split(new RegExp("(" + esc.join("|") + ")")).forEach((part, i) => { if (part) frag.append(i % 2 ? h("mark", null, part) : document.createTextNode(part)); });
    return frag;
  }
  function showTip(e, spec) {
    const head = h("div", "thead");
    head.append(h("b", spec.ok ? "okc" : spec.miss ? "missc" : null, spec.head), h("span", "tdate", day(spec.ms)));
    tip.replaceChildren(head);
    const say = (you, marks) => { const q = h("div", "say"); q.append(h("span", "who", "You"), marked(you, marks)); return q; };
    if (spec.items && spec.items.length > 1) {
      for (const it of spec.items) {
        tip.append(h("div", "ihead", it.head + (it.line ? ": " + it.line : "")));
        if (it.you) tip.append(say(it.you, it.marks));
      }
    } else {
      if (spec.line) tip.append(h("div", null, spec.line));
      if (spec.you) tip.append(say(spec.you, spec.marks));
    }
    tip.hidden = false; placeTip(e);
  }
  addEventListener("scroll", () => { tip.hidden = true; }, {passive: true});
  // A mark: hover it for what happened and your words at that moment.
  function tile(cls, glyph, spec) {
    const x = h("span", cls, glyph);
    x.setAttribute("aria-label", spec.head);
    x.addEventListener("mouseenter", e => showTip(e, spec));
    x.addEventListener("mousemove", placeTip);
    x.addEventListener("mouseleave", () => { tip.hidden = true; });
    return x;
  }

  // ---------- whole files, rendered as Markdown ----------
  // A small renderer for what harness files use: front matter, headings, lists, tables, quotes, code, bold, italic,

      for (const r of list) box.append(card(r));
    }
    if (hidden) box.append(h("div", "quiet", plural(hidden, "unused skill", "unused skills") + " hidden"));
    fitTiles();
  }
  // Files (a card per file) | Problems (issues no file covers), with the open problems counted on the tab.
  function paintTabs(nGaps) {
    const bar = $("tabs");
    $("tabrow").hidden = false;
    bar.replaceChildren();
    for (const [key, label] of [["files", "Files"], ["problems", "Problems"]]) {
      const b = h("button", "tab", label);
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(tab === key));
      if (key === "problems" && nGaps) b.append(h("span", "cnt", String(nGaps)));
      b.addEventListener("click", () => {
        if (tab === key) return;
        tab = key;
        try { localStorage.setItem("tab", tab); } catch (e) {}
        renderCards();
      });
      bar.append(b);
    }
  }

  // ---------- right-click: copy a prompt to ask Claude about what's under the mouse ----------
  const LOGS = "Session logs are in ~/.claude/projects/*/<session id>.jsonl.";
  const when = ms => new Date(ms).toLocaleDateString(undefined, {month: "short", day: "numeric", year: "numeric"});
  const ids = list => list.length ? list.join(", ") : "none";
  // Session ids of version k's good and bad uses, in view.
  function uses(r, k = r.clusters.length - 1) {
    const {from, to} = windowOf(r, k), good = new Set(), bad = new Set();
    for (const [sid, vd, use] of verdicts(r, k)) {
      const s = D.byId.get(sid), v = verdictOf(r, vd), ms = s && usageTime(r, s, use);
      if (!s || !inScope(s) || ms < from || ms >= to) continue;
      if (v === "worked") good.add(sid); else if (v === "failed") bad.add(sid);
    }
    return {good: [...good], bad: [...bad]};
  }
  const versionOf = (r, k) => r.clusters.length ? "v" + (k + 1) + " of " + r.clusters.length + ", in force since " + when(Date.parse(r.clusters[k].end)) : "unchanged in the last 30 days";
  // Every bad use in view of a file, newest version first, each tagged with its version; ones on the latest are still happening.
  function badLines(r) {
    const n = Math.max(1, r.clusters.length), vn = "v" + n, lines = [];
    const since = r.clusters.length ? ", in force since " + when(Date.parse(r.clusters[n - 1].end)) : "";
    for (let j = n - 1; j >= 0; j--) for (const b of versionMarks(r, j).bads) {
      const said = b.items.find(it => it.you), what = b.items.map(it => it.line || it.head).join("; ");
      lines.push("- v" + (j + 1) + ", " + when(b.ms) + ", session " + b.sid + ": " + (b.missed ? "didn't load when it should have: " : "") + what + (said ? ' (I said: "' + said.you + '")' : "") + (j === n - 1 ? " [still happening]" : ""));
    }
    return {vn, since, lines};
  }
  // The page's prompt is every card's prompt in one: each file with a bad use (any version) is checked as it is now
  // against all its past bad uses, then one set of edits across the files. Files with no bad use and unused skills stay out.
  function pagePrompt() {
    const rows = scope === "global" ? globalRows() : projectRows().concat(globalRows());
    const where = scope === "global" ? "all my projects" : (D.scopes.find(x => x.key === scope) || {label: scope}).label;
    const out = [];
    for (const r of rows) {
      const {vn, since, lines} = badLines(r);
      if (lines.length) out.push(r.path + " (" + r.kind + ", now " + vn + since + "):", ...lines);
    }
    if (!out.length) return "Use the /harness-doctor:diagnose skill. None of my harness files has a bad use in " + where + " in the last 30 days. Check " +
      rows.map(r => r.path).join(", ") + " and say whether any of them still needs a change. Don't apply anything.";
    return ["Use the /harness-doctor:diagnose skill to check my harness files in " + where + " as they are now against their past bad uses, older versions included:", ...out, LOGS,
      "For each bad use, quote the line in the file's current version that would have prevented it, or say none does. For a skill that didn't load, put what I said next to the words in its description, and fix the description, not the body.",
      "Then find what keeps going wrong across the files, and propose one set of edits that fixes the ones still open. Don't apply them."].join("\n");
  }
  // A card's prompt checks the file as it is now against every bad use in view, older versions included: would the
  // latest version have prevented each one? Bad uses on the latest version itself are still happening.
  function cardPrompt(r) {
    if (r.kind === "skill" && !sessionsUsing(r, D.from).length) {  // an unused skill: why doesn't it load?
      const where = scope === "global" ? "any session" : "any session in " + (D.scopes.find(x => x.key === scope) || {label: scope}).label;
      const missed = badLines(r).lines;
      return ["Use the /harness-doctor:diagnose skill on " + r.path + ". This skill hasn't loaded in " + where + " in the last 30 days.",
        ...(missed.length ? ["The harness doctor found these moments where it should have loaded:", ...missed] : []),
        "Find out why: read its name and description, then look through my recent sessions (~/.claude/projects/*/*.jsonl) for moments where it should have loaded.",
        "Say whether it's needed at all. If it is, say why it didn't load (what I actually said, next to the words in its description) and how to change the description so it does. Don't apply anything."].join("\n");
    }
    const {vn, since, lines} = badLines(r);
    if (!lines.length) {
      const u = uses(r);
      return ["Use the /harness-doctor:diagnose skill on " + r.path + " (" + r.kind + ", " + vn + since + "). It has no bad uses in the last 30 days.",
        "Good uses: " + ids(u.good) + ".", LOGS, "Say whether it's doing its job and whether anything should change. Don't apply anything."].join("\n");
    }
    return ["Use the /harness-doctor:diagnose skill to check " + r.path + " (" + r.kind + ") as it is now (" + vn + since + ") against its past bad uses:", ...lines, LOGS,
      "For each one, quote the line in " + vn + " that would have prevented it, or say none does. For one where it didn't load, put what I said next to the words in its description, and fix the description, not the body.",
      "Then suggest edits for the ones still open. Don't apply anything."].join("\n");
  }
  function issuePrompt(r, sid, items) {
    const s = D.byId.get(sid), out = ["In session " + sid + " (" + when(s.ms) + ", in " + s.cwd + "), " + r.path + " had " + (items.length > 1 ? "these issues:" : "this issue:")];
    for (const it of items) {
      out.push("- " + it.head + (it.line ? ": " + it.line : ""));
      if (it.you) out.push('  I said: "' + it.you + '"');
    }
    out.push("Read that session's log (~/.claude/projects/*/" + sid + ".jsonl) around that moment, then tell me what happened and which line of " + r.path + " caused it.");
    return out.join("\n");
  }
  function gapsPrompt(gaps) {
    const out = ["Use the /harness-doctor:diagnose skill. These issues keep happening, and no CLAUDE.md, skill or output style covers them:"];
    for (const g of gaps) {
      out.push("- " + topicName(g.topic) + " (" + plural(g.items.length, "session", "sessions") + "):");
      for (const it of g.items) out.push("  - " + when(it.ms) + ", session " + it.sid + ": " + it.gap.line + (it.gap.you ? ' I said: "' + it.gap.you + '"' : ""));
    }
    out.push(LOGS, "Read those moments. For each problem, say where a fix belongs: a new skill (a procedure for a certain moment), a new rule in CLAUDE.md (always on), or a hook (something that must happen automatically), and write its full text. Group problems that one fix would cover. Don't create anything.");
    return out.join("\n");
  }
  function gapPrompt(g) {
    const out = ["Use the /harness-doctor:diagnose skill. This issue keeps happening, and no CLAUDE.md, skill or output style covers it: " + topicName(g.topic) + " (" + plural(g.items.length, "session", "sessions") + ")."];
    for (const it of g.items) {
      out.push("- " + when(it.ms) + ", session " + it.sid + ": " + it.gap.line);
      if (it.gap.you) out.push('  I said: "' + it.gap.you + '"');
    }
    out.push(LOGS, "Read those moments and say where a fix belongs: a new skill (a procedure for a certain moment), a new rule in CLAUDE.md (always on), or a hook (something that must happen automatically). Write its full text. Don't create it.");
    return out.join("\n");
  }
  function gapIssuePrompt(it) {
    const s = D.byId.get(it.sid), out = ["In session " + it.sid + " (" + when(it.ms) + ", in " + s.cwd + "), this issue happened, and no harness file covers it: " + it.gap.line];
    if (it.gap.you) out.push('I said: "' + it.gap.you + '"');
    out.push("Read that session's log (~/.claude/projects/*/" + it.sid + ".jsonl) around that moment, then tell me what happened and what instruction would have prevented it.");
    return out.join("\n");
  }
  const ctx = $("ctx");
  let ctxTimer;  // closes the menu shortly after "Copied"; a new right-click cancels it
  function hideCtx() { clearTimeout(ctxTimer); ctx.hidden = true; }
  document.addEventListener("contextmenu", e => {
    if (!D || e.target.closest("#ctx,select,.edit") || String(getSelection())) return;  // keep the browser's menu for editing and selected text
    let make = pagePrompt;
    for (let n = e.target; n; n = n.parentElement) if (n.promptFn) { make = n.promptFn; break; }
    e.preventDefault();
    clearTimeout(ctxTimer);
    tip.hidden = true;
    const text = make(), b = h("button", null, "Copy prompt:");
    b.type = "button";
    b.setAttribute("role", "menuitem");
    b.append(h("span", "pbox q", text));  // the whole prompt, scrollable inside the menu
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); b.textContent = "Copied ✓"; } catch (err) { b.textContent = "Couldn't copy"; }
      ctxTimer = setTimeout(hideCtx, 600);
    });
    ctx.replaceChildren(b);
    ctx.hidden = false;
    const w = ctx.offsetWidth, ht = ctx.offsetHeight;
    ctx.style.left = Math.max(8, Math.min(e.clientX, innerWidth - w - 8)) + "px";
    ctx.style.top = Math.max(8, Math.min(e.clientY, innerHeight - ht - 8)) + "px";
    b.focus();
  });
  document.addEventListener("click", e => { if (!e.target.closest("#ctx")) hideCtx(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hideCtx(); });
  addEventListener("scroll", hideCtx, {passive: true});
  addEventListener("blur", hideCtx);

  // ---------- page ----------
  // Next to the button: out of date (what's waiting) or up to date (when it last checked). The job's own progress wins.
  let jobRunning = false;
  function paintStatus() {
    if (jobRunning || !D) return;
    const p = (D.pending || {})[scope] || {}, todo = [], m = $("msg");
    if (p.judge) todo.push(plural(p.judge, "new session", "new sessions") + " to judge");
    if (p.ongoing) todo.push(plural(p.ongoing, "ongoing session", "ongoing sessions") + " to judge");
    if (p.diagnose) todo.push(plural(p.diagnose, "file", "files") + " to diagnose");
    if (p.recheck) todo.push("problems to re-check against your files");
    if (p.problems) todo.push(plural(p.problems, "problem", "problems") + " to work out a fix for");
    m.replaceChildren();
    if (!p.has_data) m.append(h("span", "stale", "No data yet"), " · press Judge new sessions");
    else if (todo.length) m.append(h("span", "stale", "Out of date"), " · " + todo.join(", "));
    else m.append("No new sessions to judge" + (D.last_judged ? " · last checked " + day(Date.parse(D.last_judged)) : ""));
    paintStale(p.stale || {}, p.has_data);
  }
  // The orange box: sessions judged with older rules keep their old marks. The main button never re-judges them,
  // so this box says why they might be wrong, shows the rules diff to decide, and judges just them again.
  let staleDiff = false;
  function paintStale(st, hasData) {
    const box = $("stale");
    box.hidden = !(st.count && hasData);
    if (box.hidden) return;
    const n = st.count, b = h("button", "again", "Judge " + (n === 1 ? "it" : "these " + n) + " again");
    b.type = "button";
    b.disabled = jobRunning;
    b.addEventListener("click", () => start(true));
    box.replaceChildren(h("b", null, plural(n, "session was", "sessions were") + " judged with older rules"), b,
      h("div", "why", "Judge new sessions skips them, so they keep marks from the old rules. " +
        (st.diff ? "Read what changed to see if it's worth judging them again." : "They were judged before harness doctor kept its rules, so there's no diff to show.")));
    if (st.diff) {
      const t = h("button", "mini", staleDiff ? "Hide what changed" : "Show what changed in the rules");
      t.type = "button";
      t.addEventListener("click", () => { staleDiff = !staleDiff; paintStale(st, hasData); });
      box.append(t);
      if (staleDiff) box.append(diffPre(st.diff));
    }
  }
  function fillScopes() {
    const sel = $("scope");
    sel.replaceChildren();
    for (const s of D.scopes) { const o = h("option", null, s.label); o.value = s.key; sel.append(o); }
    if (!D.scopes.some(s => s.key === scope)) scope = "global";
    sel.value = scope;
  }
  async function load(fresh) {
    $("msg").textContent = "Reading your sessions…";
    try { D = await (await fetch("/api/data" + (fresh ? "?fresh=1" : ""))).json(); }
    catch (e) { $("msg").textContent = "Can't reach the server. Is Harness Doctor running? Run /harness-doctor:open."; return; }
    for (const s of D.sessions) s.ms = Date.parse(s.t);
    D.sessions.sort((a, b) => a.ms - b.ms);
    D.byId = new Map(D.sessions.map(s => [s.id, s]));
    fillScopes();
    renderCards();
  }
  $("scope").addEventListener("change", e => {
    scope = e.target.value; open.clear(); renderCards();
    try { localStorage.setItem("scope", scope); } catch (err) {}  // the pick stays after a reload or restart
  });
  $("refresh").addEventListener("click", () => load(true));
  const ub = $("unused");
  const paintToggle = () => { ub.setAttribute("aria-pressed", String(showUnused)); ub.textContent = showUnused ? "Unused skills shown" : "Unused skills hidden"; };
  paintToggle();
  ub.addEventListener("click", () => {
    showUnused = !showUnused; paintToggle();
    try { localStorage.setItem("showUnused", showUnused ? "1" : "0"); } catch (e) {}
    renderCards();
  });
  // "Judge new sessions": scores recent sessions with /insights if needed, then sorts the new ones (one cheap run).
  // While it runs, the button shows a spinner, plus the percent once the sorting starts.
  function busy(on, pct) {
    const b = $("doctor"), again = document.querySelector("#stale .again");
    b.disabled = on;
    if (again) again.disabled = on;
    b.replaceChildren();
    if (!on) { b.textContent = "Judge new sessions"; b.removeAttribute("aria-label"); return; }
    b.append(h("span", "spin"));
    if (pct != null) b.append(pct + "%");
    b.setAttribute("aria-label", "Harness doctor running" + (pct != null ? ", " + pct + "%" : ""));
  }
  async function poll() {
    try {
      const j = await (await fetch("/api/status")).json();
      $("msg").textContent = j.message;
      if (j.state === "running") { jobRunning = true; busy(true, j.pct); setTimeout(poll, 3000); return; }
      jobRunning = false;
      busy(false);
      if (j.state === "done") await load(true);
      else $("msg").textContent = j.message;  // an error stays visible
    } catch (e) { setTimeout(poll, 5000); }
  }
  // again: judge the sessions judged with older rules instead of the new ones.
  async function start(again) {
    busy(true, null);
    try {
      const res = await (await fetch("/api/doctor", {method: "POST", headers: {"X-Harness-Doctor": "1", "Content-Type": "application/json"}, body: JSON.stringify({scope, again})})).json();
      if (!res.ok) $("msg").textContent = res.message;
    } catch (e) { $("msg").textContent = "Can't reach the server."; busy(false); return; }
    poll();
  }
  $("doctor").addEventListener("click", () => start(false));
  // Night and light mode: follows the system until picked, then remembers the pick.
  function paintTheme() {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    $("theme").textContent = dark ? "☀" : "☾";
    $("theme").setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to night mode");
    $("theme").title = dark ? "Light mode" : "Night mode";
  }
  try { const th = localStorage.getItem("theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  $("theme").addEventListener("click", () => {
    const next = $("theme").textContent === "☀" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    paintTheme();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintTheme);
  paintTheme();
  fetch("/api/status").then(r => r.json()).then(j => { if (j.state === "running") { busy(true, j.pct); poll(); } }).catch(() => {});
  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(fitTiles, 120); });
  load(false);
})();
</script>
</body>
</html>
