<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Doctor</title>
<style>
@font-face{font-family:'Fredoka';font-style:normal;font-weight:500 700;font-display:swap;src:url(/fonts/fredoka.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/nunito.woff2) format('woff2')}

:root{--purple-bg:#EDE5FF;--bg:#FFF7EC;--card:#FFFFFF;--ink:#2B2A33;--soft:#8C8897;--line:#F0E5D4;--coral:#F2545B;--coral-bg:#FFE2DF;--blue:#3B82E0;--blue-bg:#DCEAFF;--green:#1F9D6B;--green-bg:#DDF5EA;--purple:#8B5CF6;--yellow:#E8A800;--orange:#E2741F;--orange-bg:#FFE8D4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--purple-bg:#2C2342;--bg:#16141D;--card:#211E2B;--ink:#F5F2FA;--soft:#A6A1B5;--line:#302C3D;--coral:#FF6B70;--coral-bg:#3A2030;--blue:#5DA5F2;--blue-bg:#1D2C45;--green:#3DD39A;--green-bg:#173A2D;--purple:#A78BFA;--yellow:#F5C542;--orange:#FF9A4D;--orange-bg:#3A2A1C}}
:root[data-theme="dark"]{--purple-bg:#2C2342;--bg:#16141D;--card:#211E2B;--ink:#F5F2FA;--soft:#A6A1B5;--line:#302C3D;--coral:#FF6B70;--coral-bg:#3A2030;--blue:#5DA5F2;--blue-bg:#1D2C45;--green:#3DD39A;--green-bg:#173A2D;--purple:#A78BFA;--yellow:#F5C542;--orange:#FF9A4D;--orange-bg:#3A2A1C}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Nunito,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:32px 16px 110px}
h1{font:700 42px/1.05 Fredoka,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 22px}
.pill{font:700 15px Nunito,system-ui,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.pill:disabled{opacity:.5;cursor:default}
.pill[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue-bg);color:var(--blue)}
.pill[aria-pressed="false"]{color:var(--soft)}
.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#msg{color:var(--soft);font-size:15px;flex-basis:100%}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:190px}
.spin{width:16px;height:16px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none;border-right-color:currentColor;opacity:.5}}
.cards{display:grid;gap:12px}
.group{font:600 14px Fredoka,system-ui,sans-serif;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;margin:10px 4px 0}
.card{position:relative;overflow:hidden;background:var(--card);border-radius:24px;padding:16px 20px 16px 26px;display:grid;grid-template-columns:minmax(140px,auto) minmax(0,1fr) auto;gap:4px 12px;align-items:center;box-shadow:0 3px 0 var(--line);cursor:pointer;transition:transform .12s ease}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:color-mix(in srgb,var(--kind) 65%,var(--card))}
.card.k-rules{--kind:var(--blue)}.card.k-style{--kind:var(--purple)}.card.k-skill{--kind:var(--yellow)}
.card:hover{transform:translateY(-2px)}
.card.idle{box-shadow:none;background:transparent;outline:2px dashed var(--line);outline-offset:-2px}
.card.idle>:not(.more),.card.idle::before{opacity:.55}
.nm{font:600 23px/1.2 Fredoka,system-ui,sans-serif;overflow-wrap:anywhere}
.sub{color:var(--soft);font-size:14px;overflow-wrap:anywhere}
.sub .kp{position:relative;cursor:copy}
.sub .kp .path{position:absolute;left:-8px;top:-4px;z-index:2;padding:3px 8px;border-radius:8px;background:var(--card);color:var(--ink);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .12s}
.sub .kp:hover .path{opacity:1;pointer-events:auto}
.sub .kp .path.done{color:var(--green);font-weight:700}
.xs{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:0;padding:4px;margin:-4px;user-select:none;--fl:0px;--fr:0px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.xs::-webkit-scrollbar{display:none}
.xs>:first-child{margin-left:auto}
.xs.scrolls{cursor:grab}.xs.dragging{cursor:grabbing}
.x,.ok,.miss{position:relative;flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:700 19px/1 Fredoka,system-ui,sans-serif;cursor:default;transition:transform .1s ease}
.x{background:var(--coral-bg);color:var(--coral)}
.ok{background:var(--green-bg);color:var(--green)}
.miss{background:var(--orange-bg);color:var(--orange)}
.x.qb{background:var(--purple-bg);color:var(--purple)}
.x:hover,.ok:hover,.miss:hover{transform:scale(1.08)}
.vdiff{grid-column:1/-1;border-top:2px dashed var(--line);margin-top:10px;padding-top:12px;cursor:auto}
.vdiff h3{font:600 16px Fredoka,system-ui,sans-serif;margin:0}
#tip{position:fixed;z-index:10;max-width:440px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;pointer-events:none}
#tip .thead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:4px}
#tip b{font:600 21px/1.2 Fredoka,system-ui,sans-serif;color:var(--coral)}
#tip b.okc{color:var(--green)}
#tip b.missc{color:var(--orange)}
#tip b.quietc{color:var(--purple)}
#tip .tdate{color:var(--soft);font-size:13px;white-space:nowrap}
#tip .say{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:13px;line-height:1.4}
#tip .who{display:block;font:600 12px Fredoka,system-ui,sans-serif;color:var(--soft);margin-bottom:2px}
#tip mark{background:var(--coral-bg);color:var(--coral);font-weight:700;border-radius:5px;padding:0 3px}
#tip .meta{margin-top:6px}
#tip .ihead{margin-top:8px;font-weight:700}
.more{grid-column:1/-1;border-top:2px dashed var(--line);margin-top:10px;padding-top:14px;display:grid;gap:18px;cursor:auto}
.more h3{font:600 16px Fredoka,system-ui,sans-serif;margin:0}
.more ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.meta{color:var(--soft);font-size:13px}
.fhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.fhead .pill{font-size:14px;padding:6px 14px}
.pbox{background:var(--bg);border-radius:14px;padding:12px 14px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;cursor:text}
.mini{font:700 13px Nunito,system-ui,sans-serif;color:var(--blue);background:var(--blue-bg);border:none;border-radius:999px;padding:5px 12px;cursor:pointer}
.mini:disabled{opacity:.6;cursor:default}
.ctx{position:fixed;z-index:20;max-width:min(640px,calc(100vw - 16px));background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.ctx button{display:block;width:100%;text-align:left;font:700 14px Nunito,system-ui,sans-serif;color:var(--ink);background:transparent;border:none;border-radius:10px;padding:8px 12px;cursor:pointer}
.ctx button:hover,.ctx button:focus-visible{background:var(--bg);outline:none}
.ctx .q{display:block;margin-top:6px;color:var(--ink);font-weight:400;max-height:min(320px,60vh);overscroll-behavior:contain;cursor:pointer}
.still *,.still *::before,.still *::after{transition:none!important}
pre{margin:0;max-height:320px;overflow:auto;background:var(--bg);border-radius:14px;padding:10px 12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
pre .a{color:#1F9D6B;display:block}pre .d{color:var(--coral);display:block}pre .h{color:var(--soft);display:block}
pre.clamp{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
pre.tall{max-height:65vh}
.md{background:var(--bg);border-radius:14px;padding:12px 18px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.md.tall{max-height:65vh;overflow:auto}
.md.clamp{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.md h2,.md h3,.md h4,.md h5,.md h6{font:600 17px/1.3 Fredoka,system-ui,sans-serif;margin:16px 0 6px}
.md h2{font-size:21px}.md h3{font-size:18px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md li{margin:3px 0}
.md code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);border-radius:6px;padding:1px 5px}
.md pre{background:var(--card);margin:8px 0;max-height:none}
.md table{border-collapse:collapse;margin:8px 0;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--soft)}
.md hr{border:none;border-top:2px dashed var(--line);margin:12px 0}
.md a{color:var(--blue)}
.md .fm{font-size:13px;color:var(--soft);border-bottom:2px dashed var(--line);padding-bottom:8px;margin-bottom:6px}
.md .fm b{color:var(--ink)}
.quiet{color:var(--soft);font-size:15px;margin:6px 4px}
.empty{color:var(--soft);font-size:18px;text-align:center;padding:56px 16px;border:2px dashed var(--line);border-radius:18px}
.empty b{color:var(--ink)}
.card.k-gaps{--kind:var(--coral)}
.vsq{flex:none;width:38px;height:44px;margin-left:6px;border:none;border-radius:10px;background:transparent;color:var(--soft);font:700 15px Fredoka,system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;position:relative;transition:background .12s,color .12s}
.vsq:hover,.vsq:focus-visible{background:var(--bg);color:var(--ink);outline:none}
.vsq .car{position:absolute;left:50%;transform:translateX(-50%);font-size:7px;padding:2px 10px;opacity:.35;cursor:pointer;transition:opacity .15s}
.vsq .car.up{top:2px}.vsq .car.down{bottom:2px}
.vsq:hover .car,.vsq:focus-visible .car{opacity:.7}
.vsq .car:hover{opacity:1}
.vsq .car.dim,.vsq:hover .car.dim{opacity:0;cursor:default}
.vsq.old{color:var(--kind)}
.vsq.on{background:color-mix(in srgb,var(--kind) 22%,transparent);color:var(--ink)}
.vseg{position:relative}
.vseg.sel .x,.vseg.sel .ok{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ink) 28%,transparent)}
.vseg.sel .vnone{border-color:color-mix(in srgb,var(--ink) 28%,transparent)}
.vseg{flex:none;display:flex;align-items:center;gap:8px}
.vseg.old{padding-left:19px}
.vseg.old::before{content:"";position:absolute;left:4px;top:50%;width:3px;height:20px;margin-top:-10px;border-radius:3px;background:color-mix(in srgb,var(--soft) 35%,transparent)}
.vnone{flex:none;width:40px;height:40px;box-sizing:border-box;border-radius:13px;border:2px dashed var(--line)}

.tabrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:-6px 0 16px}
.tabs{display:flex;gap:6px}
.tabrow .pill{font-size:14px;padding:6px 14px}
.tab{font:600 18px Fredoka,system-ui,sans-serif;color:var(--soft);background:transparent;border:none;border-radius:999px;padding:8px 18px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tab .cnt{font:700 13px Nunito,system-ui,sans-serif;background:var(--coral-bg);color:var(--coral);border-radius:999px;padding:2px 9px}
#msg .stale{color:var(--coral);font-weight:700}
#stale{background:var(--orange-bg);border-radius:14px;padding:14px 18px;margin:-8px 0 22px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
#stale[hidden]{display:none}
#stale b{color:var(--orange);font-size:16px}
#stale .why{color:var(--soft);font-size:14px;grid-column:1}
#stale .again{grid-column:2;grid-row:1/3;font:700 15px Nunito,system-ui,sans-serif;color:var(--orange);background:var(--card);border:2px solid var(--orange);border-radius:999px;padding:7px 16px;cursor:pointer}
#stale .again:disabled{opacity:.6;cursor:default}
#stale .mini{grid-column:1;justify-self:start;margin-top:6px;color:var(--orange);background:var(--card)}
#stale pre{grid-column:1/-1;margin-top:8px;background:var(--card)}
@media (max-width:600px){#stale{grid-template-columns:1fr}#stale .again{grid-column:1;grid-row:auto;justify-self:start;margin-top:6px}}
@media (max-width:600px){h1{font-size:34px}.card{grid-template-columns:1fr auto}.xs{grid-column:1/-1;grid-row:2;justify-content:flex-start}.xs>:first-child{margin-left:0}}

.note{background:var(--purple-bg);border-radius:14px;padding:10px 16px;font-size:14px;margin:0 0 18px}
button.x,button.ok,button.miss{border:none;cursor:pointer;padding:0}
.x.off,.ok.off,.miss.off{background:transparent;color:var(--soft);outline:2px dashed var(--line);outline-offset:-2px;text-decoration:line-through}
.x.pin,.ok.pin,.miss.pin{box-shadow:0 0 0 3px var(--ink)}
.vlab{font:700 12px Nunito,system-ui,sans-serif;color:var(--soft);margin-right:2px}
.more{padding-top:10px}
.rules{display:grid;column-gap:0;row-gap:2px;align-items:center}
.rgrp{grid-column:1/-1;font:600 12px Fredoka,system-ui,sans-serif;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 2px 12px}
.rrow{display:grid;grid-template-columns:subgrid;grid-column:1/-1;align-items:center;min-height:38px;border-radius:12px}
.rrow:not(.rhead):hover{background:var(--bg)}
.rrow .rt{font-weight:700;font-size:15px;overflow-wrap:anywhere;padding:4px 22px 4px 12px;position:relative}
.rrow.bad .rt::before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--coral)}
.rrow.none .rt{color:var(--soft);font-weight:400}
.rrow .never{padding-left:14px}
.vcol{display:flex;gap:5px;align-items:center;padding:4px 14px;min-height:36px}
.vcol.old{border-left:3px solid color-mix(in srgb,var(--soft) 30%,transparent)}
.rhead{min-height:0}
.rhead .vcol{font:700 12px Nunito,system-ui,sans-serif;color:var(--soft);min-height:0;padding-top:0;padding-bottom:0;border-left-color:transparent}
.rend{display:flex;justify-content:flex-end}
.vcol .x,.vcol .ok,.vcol .miss{width:28px;height:28px;border-radius:9px;font-size:14px}
@media (max-width:600px){.rrow .rt{padding-right:10px}.vcol{padding:4px 8px}}
.hp{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.st{font:700 14px Nunito,system-ui,sans-serif;border-radius:999px;padding:5px 13px;white-space:nowrap}
.st.good,.st.fixed{background:var(--green-bg);color:var(--green)}
.st.bad{background:var(--coral-bg);color:var(--coral)}
.st.worse{background:var(--coral);color:var(--card)}
.st.wait,.st.none{background:transparent;color:var(--soft);outline:2px dashed var(--line);outline-offset:-2px}
.hl{display:grid;gap:3px}
.hl .rgrp{margin-left:12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:none;border:none;border-radius:12px;padding:7px 12px;color:var(--ink);font:inherit;cursor:pointer}
.hrow:hover,.hrow.on{background:var(--bg)}
.hrow:disabled{cursor:default;background:none}
.hrow .rt{font-weight:700;font-size:16px}
.hrow:disabled .rt{color:var(--soft);font-weight:400}
.hrow .st{font-size:13px;padding:4px 11px}
.ev{display:grid;gap:8px;margin:2px 12px 10px 24px;padding-left:14px;border-left:3px solid var(--line)}
.evb{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.evb .vlab{min-width:150px}
.evb .x,.evb .ok,.evb .miss{width:30px;height:30px;border-radius:10px;font-size:15px}
.evd pre{margin-top:4px}
.hl{gap:18px}
.gsec{display:grid;gap:8px}
.ghead{display:flex;align-items:baseline;gap:10px;margin:0 2px}
.gname{font:600 17px Fredoka,system-ui,sans-serif}
.gsum{font-size:13px;color:var(--soft)}
.gsum.bad{color:var(--coral);font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-items:stretch}
.rc{background:var(--bg);border-radius:16px;border:2px solid transparent}
.rc.s-bad,.rc.s-worse{border-color:color-mix(in srgb,var(--coral) 45%,transparent)}
.rc.s-none{background:transparent;border:2px dashed var(--line)}
.rc.on{grid-column:1/-1;border-color:var(--ink)}
.rtop{display:grid;gap:6px;justify-items:start;align-content:start;height:100%;width:100%;text-align:left;background:none;border:none;border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer}
.rtop:disabled{cursor:default}
.rtop .rt{font:600 17px/1.25 Fredoka,system-ui,sans-serif}
.rtop .rx{color:var(--soft);font-size:13px;line-height:1.35}
.rtop .st{font-size:12px;padding:3px 10px}
.rc.s-none .rt{color:var(--soft)}
.rc .ev{margin:0 14px 12px;padding-left:12px}
.tree{background:var(--card);border-radius:24px;padding:12px 14px;box-shadow:0 3px 0 var(--line)}
.kids{margin-left:15px;padding-left:12px;border-left:2px solid var(--line)}
.trow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:6px 8px;color:var(--ink);font:inherit;cursor:pointer;min-height:38px}
.trow:hover{background:var(--bg)}
.trow:disabled{cursor:default;background:none}
.chev{flex:none;width:16px;color:var(--soft);font-size:13px}
.tname{flex:1;min-width:0;overflow-wrap:anywhere}
.t-folder .tname{font:600 18px Fredoka,system-ui,sans-serif;color:var(--soft)}
.t-file .tname{font:600 20px Fredoka,system-ui,sans-serif}
.t-file .tname::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:9px;background:var(--kind)}
.trow.k-rules{--kind:var(--blue)}.trow.k-style{--kind:var(--purple)}.trow.k-skill{--kind:var(--yellow)}
.t-group .tname{font:600 15px Fredoka,system-ui,sans-serif}
.t-rule .tname{font-size:15px}
.t-rule:disabled .tname{color:var(--soft)}
.trow .st{font-size:12px;padding:3px 10px}
.t-file .st{font-size:13px;padding:4px 12px}
.node>.ev{margin:2px 8px 10px 32px}
#tip.pinned{pointer-events:auto;border-color:var(--ink)}
#tip .tacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#tip .rl{margin-top:6px;color:var(--soft);font-size:13px}

/* ---- polish ---- */
.tree{padding:10px 12px 14px}
.kids{margin-left:17px;padding-left:10px;border-left:1px solid var(--line)}
.trow{gap:10px;padding:5px 10px;min-height:36px;border-radius:10px}
.chev{width:14px;font:700 18px/1 Nunito,system-ui,sans-serif;color:var(--soft);text-align:center;transition:transform .12s}
.trow.open>.chev{transform:rotate(90deg)}
.t-folder{margin-top:6px}
.t-folder .tname{font:600 13px Fredoka,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.t-file{min-height:46px}
.t-file .tname{font:600 21px Fredoka,system-ui,sans-serif}
.t-file .tname::before{width:9px;height:9px;border-radius:50%;margin-right:10px;vertical-align:2px}
.t-group .tname{font:600 15px Fredoka,system-ui,sans-serif}
.t-rule{min-height:32px;padding-top:3px;padding-bottom:3px}
.t-rule .tname{font-size:15px}
.t-rule.open{background:var(--bg)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;margin:0 3px;background:var(--line)}
.d-good,.d-fixed{background:var(--green)}.d-bad,.d-worse{background:var(--coral)}
.d-none,.d-wait{background:transparent;box-shadow:inset 0 0 0 1.5px var(--soft);opacity:.6}
.sum{display:flex;align-items:center;gap:12px;flex:none}
.sm{font:700 13px Nunito,system-ui,sans-serif;white-space:nowrap}
.sm.bad{color:var(--coral)}.sm.good,.sm.fixed{color:var(--green)}.sm.none,.sm.wait{color:var(--soft);font-weight:400}
.t-rule .sm{font-weight:600;font-size:13px}
.t-rule .sm.good{opacity:.75}
.trow .st.worse{font-size:12px;padding:2px 10px}
.node>.ev{margin:4px 0 10px 24px;padding:10px 14px;border:none;border-radius:12px;background:var(--bg);gap:6px}
.evb .vlab{min-width:170px;font-weight:600;font-size:13px}
.evb .x,.evb .ok,.evb .miss{width:26px;height:26px;border-radius:8px;font-size:13px}
.evd{margin-top:4px}.evd pre{background:var(--card)}
.tab .cnt{background:var(--orange-bg);color:var(--orange)}
.card.k-gaps{--kind:var(--orange)}
.quiet{margin:0 4px 6px}
.note{padding:8px 14px;font-size:13px;margin-bottom:14px}

/* ---- one card per file ---- */
.fc{position:relative;overflow:hidden;background:var(--card);border-radius:22px;box-shadow:0 3px 0 var(--line)}
.fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:color-mix(in srgb,var(--kind) 65%,var(--card))}
.fc.k-rules{--kind:var(--blue)}.fc.k-style{--kind:var(--purple)}.fc.k-skill{--kind:var(--yellow)}
.fhd{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:14px 20px 14px 26px;background:none;border:none;text-align:left;color:inherit;font:inherit;cursor:pointer}
.fl{display:grid}
.fl .nm{font-size:21px}
.rl{padding:2px 16px 16px 26px;border-top:2px dashed var(--line);margin:0}
.glab{font:600 12px Fredoka,system-ui,sans-serif;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 4px}
.gl{margin-left:3px;padding-left:8px;border-left:1px solid var(--line)}
.rr{display:flex;align-items:center;gap:10px;min-height:34px;padding:2px 10px;border-radius:10px}
.rr:hover,.rr:focus-within{background:var(--bg)}
.rr .tname{font-size:15px}
.rr.s-none .tname{color:var(--soft)}
.rr .marks{display:flex;align-items:center;gap:4px;margin-left:auto;visibility:hidden}
.rr:hover .marks,.rr:focus-within .marks{visibility:visible}
.rr .marks+.st,.rr .marks+.sm{margin-left:6px}
.marks .x,.marks .ok,.marks .miss{width:22px;height:22px;border-radius:7px;font-size:11px}
.vsep{font:700 11px Nunito,system-ui,sans-serif;color:var(--soft);margin:0 2px 0 8px;padding-left:8px;border-left:2px solid color-mix(in srgb,var(--soft) 35%,transparent)}
.rr .st.worse{font-size:12px;padding:2px 10px;cursor:help}
#tip .rl2{font-weight:700;margin-bottom:6px}
.pill.fix{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bg)}

/* ---- Rules | History ---- */
.sw{display:inline-flex;gap:2px;margin:12px 0 0;padding:3px;border-radius:999px;background:var(--bg)}
.swb{font:700 13px Nunito,system-ui,sans-serif;color:var(--soft);background:none;border:none;border-radius:999px;padding:4px 14px;cursor:pointer}
.swb.on{background:var(--card);color:var(--ink)}
.hist{display:grid;gap:0;margin:14px 0 0 6px;border-left:2px solid var(--line)}
.he{position:relative;padding:0 6px 18px 20px;display:grid;gap:5px}
.he:last-child{padding-bottom:2px}
.he::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--soft)}
.he.now::before{background:var(--ink);border-color:var(--ink)}
.htop{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.htop b{font:600 17px Fredoka,system-ui,sans-serif}
.htop .sp{flex:1}
.htop .mini.on{background:var(--blue);color:var(--card)}
.hl2{display:flex;gap:10px;align-items:baseline;font-size:15px}
.hk{flex:none;width:96px;font:700 13px Nunito,system-ui,sans-serif}
.hl2.broke .hk,.hl2.broke .hv{color:var(--coral)}
.hl2.broke .hv{font-weight:700}
.hl2.fixed .hk{color:var(--green)}
.hl2.still .hk,.hl2.first .hk{color:var(--coral)}
.he pre{margin-top:4px;background:var(--bg);max-height:280px}

/* ---- no tiles: a rule's hover card lists what happened ---- */
.rr.has{cursor:default}
.rr.pin{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
#tip .rname{font-weight:700;margin-bottom:4px}
#tip b.nonec{color:var(--soft)}
#tip .ml{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-top:8px;padding-left:10px;border-left:3px solid var(--coral)}
#tip .ml.off{border-left-color:var(--line);color:var(--soft);text-decoration:line-through}
#tip .hint{font-style:italic}
#tip.pinned{max-height:72vh;overflow:auto}

/* ---- history: the diff shows right away, cut ---- */
.he pre{margin-top:6px}
.he pre.cut{-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.he pre.src{color:var(--ink)}
.hacts{display:flex;gap:8px}

/* ---- the fix prompt floats in the bottom right corner ---- */
#fixall{position:fixed;right:24px;bottom:24px;z-index:6;font-size:16px;padding:12px 22px;color:var(--bg);background:var(--blue);border-color:var(--blue);box-shadow:0 8px 24px rgba(0,0,0,.35)}
#msg{position:fixed;right:24px;bottom:84px;z-index:6;max-width:320px;flex-basis:auto;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#msg:empty{display:none}
main{padding-bottom:130px}

/* ---- click a rule: the text that defines it ---- */
.rr.clk{cursor:pointer}
.rr.opened{background:var(--bg);border-radius:10px 10px 0 0}
.rtext{background:var(--bg);border-radius:0 0 10px 10px;padding:0 14px 12px 36px;margin-bottom:6px;font-size:15px;line-height:1.5}
.rsrc{color:var(--soft);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:4px}

/* ---- both actions float in the bottom right corner, stacked; the cards leave that corner's column free ---- */
#dock{position:fixed;right:24px;bottom:24px;z-index:6;display:grid;gap:10px;justify-items:stretch}
#dock .pill{font-size:15px;padding:11px 20px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#fixall{position:static}
#msg{right:24px;bottom:84px;max-width:260px}
@media (min-width:900px) and (max-width:1480px){main{margin-right:250px;margin-left:auto}}

/* ---- on hover the tiles take the status word's place ---- */
.rr .marks{display:none;visibility:visible}
.rr>.st,.rr>.sm{margin-left:auto}
.rr:hover .marks,.rr:focus-within .marks{display:flex}
.rr:hover>.st,.rr:hover>.sm,.rr:focus-within>.st,.rr:focus-within>.sm{display:none}
.vsep.first{border-left:none;margin-left:0;padding-left:0}

/* ---- history: one card per rule an edit touched ---- */
.hcards{display:grid;gap:5px;margin-top:4px}
.hc{display:flex;align-items:baseline;gap:10px;background:var(--bg);border-radius:10px;padding:7px 14px;font-size:15px}
.hc .hk{flex:none;width:96px;font:700 13px Nunito,system-ui,sans-serif;color:var(--coral)}
.hc.fixed .hk{color:var(--green)}
.hc.broke .hk{color:var(--coral);font-weight:800}
:root{--teal:#2BB3B1}
.fc.k-note{--kind:var(--teal)}
.group{margin:16px 4px 2px}
.group:first-child{margin-top:0}

/* ---- "Not covered yet" as the last card of each scope ---- */
.fc.k-gap{--kind:var(--orange);background:transparent;box-shadow:none;outline:2px dashed color-mix(in srgb,var(--orange) 45%,transparent);outline-offset:-2px}
.fc.k-gap::before{display:none}
.fc.k-gap .rl{border-top-color:color-mix(in srgb,var(--orange) 30%,transparent)}
.sm.gap{color:var(--orange)}
.d-gap{background:var(--orange)}
.fl .sub{font-size:13px}
.fold{justify-self:start;background:none;border:none;color:var(--soft);font:700 14px Nunito,system-ui,sans-serif;padding:4px 6px;cursor:pointer;border-radius:8px}
.fold:hover{color:var(--ink);background:var(--card)}
#jmsg{color:var(--soft);font-size:15px}
#dock{justify-items:end}
#msg{position:static;max-width:300px}

/* ---- a long row of tiles scrolls sideways, and fades out on the side that has more ---- */
.rr .marks{flex:0 1 auto;min-width:0;max-width:55%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:4px;margin:-4px -4px -4px auto;--fl:0px;--fr:0px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.rr .marks::-webkit-scrollbar{display:none}
.marks .vsep{flex:none;position:relative;align-self:stretch;min-height:22px;width:14px;margin:0;padding:0;border:none}
.marks .vsep::before{content:"";position:absolute;left:6px;top:2px;bottom:2px;width:2px;border-radius:2px;background:color-mix(in srgb,var(--soft) 45%,transparent)}
.marks .vlat{flex:none;font:700 11px Nunito,system-ui,sans-serif;color:var(--soft);margin-right:2px}
.marks .old{opacity:.5}.marks .old:hover,.marks .old.pin{opacity:1}
.marks.scrolls,.marks.scrolls button{cursor:grab}.marks.dragging,.marks.dragging button{cursor:grabbing}
.marks{user-select:none}
.rr.sliding{background:var(--bg)}.rr.sliding .marks{display:flex}.rr.sliding>.st,.rr.sliding>.sm{display:none}
</style>
</head>
<body>
<main>
  <h1>Harness doctor</h1>
  <div class="bar">
    <select class="pill" id="scope" aria-label="Project"></select>
    <button class="pill go" id="judge" type="button" hidden></button>
    <span id="jmsg" role="status"></span>
  </div>
  <section class="cards" id="cards"></section>
</main>
<div id="dock"><span id="msg" role="status"></span><button class="pill fix" id="fixall" type="button">Copy fix prompt</button></div>
<div id="tip" hidden></div>
<script>
(function () {
  // ---------- the data: everything comes from /api/data in one object (see page_data in harness_doctor.py) ----------
  let FILES = [], MOMENTS = [], GAPS = [], ACTIVE = [], PENDING = {count: 0}, JUDGED = 0;

  // ---------- helpers ----------
  const KC = {"rules": "k-rules", "output style": "k-style", "skill": "k-skill", "note": "k-note"}, ORDER = {"rules": 0, "output style": 1, "skill": 2, "note": 3};
  const GLYPH = {x: "✕", ok: "✓", miss: "○"}, HEAD = {x: "bad use", ok: "good use", miss: "didn't load"};
  const $ = id => document.getElementById(id), tip = $("tip");
  let tab = "files", pinned = null;
  const open = new Set(), diffOpen = new Set(), gapOpen = new Set();
  function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  const fileOf = id => FILES.find(f => f.id === id);
  const latest = f => f.versions[f.versions.length - 1].v;
  const moms = (f, v, rule) => MOMENTS.filter(m => m.file === f.id && m.v === v && (!rule || m.rule === rule));
  const fails = f => moms(f, latest(f)).filter(m => m.verdict !== "ok" && !m.wrong).length;
  function marked(text, marks) {
    const out = document.createDocumentFragment();
    let rest = text;
    for (;;) {
      let at = -1, hit = "";
      for (const k of marks || []) { const i = rest.indexOf(k); if (i >= 0 && (at < 0 || i < at)) { at = i; hit = k; } }
      if (at < 0) break;
      out.append(rest.slice(0, at), h("mark", null, hit));
      rest = rest.slice(at + hit.length);
    }
    out.append(rest);
    return out;
  }

  // ---------- hover card: hover a mark to read its moment, click the mark to keep it open ----------
  function fillTip(m, rule) {
    tip.replaceChildren();
    const head = h("div", "thead"), b = h("b", m.verdict === "ok" ? "okc" : m.verdict === "miss" ? "missc" : null, m.wrong ? "marked wrong" : HEAD[m.verdict]);
    head.append(b, h("span", "tdate", m.when + " · " + m.project));
    tip.append(head, h("div", null, m.line));
    if (m.came_up > 1 && m.verdict !== "ok") tip.append(h("div", "meta", "Broke it in about " + (m.failed || 1) + " of " + m.came_up + " moments in this session."));
    if (m.you) { const s = h("div", "say"); s.append(h("span", "who", "You"), marked(m.you, m.marks)); tip.append(s); }
    if (m.claude) { const s = h("div", "say"); s.append(h("span", "who", "Claude"), marked(m.claude, m.cmarks)); tip.append(s); }
    if (pinned === m.id) {  // kept open: read-only, with a way into the session
      const acts = h("div", "tacts"), o = h("button", "mini", "Open this session");
      o.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText("claude --resume " + m.sid); o.textContent = "Copied: claude --resume " + m.sid.slice(0, 8) + "…"; }
        catch (e) { o.textContent = "claude --resume " + m.sid; }
      });
      acts.append(o);
      tip.append(acts);
    }
    tip.hidden = false;
  }
  function placeTip(x, y) {
    const w = tip.offsetWidth, ht = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - w - 8)) + "px";
    tip.style.top = Math.max(8, y + 18 + ht > innerHeight ? y - ht - 12 : y + 18) + "px";
  }
  function unpin() { pinned = null; tip.hidden = true; tip.classList.remove("pinned"); document.querySelectorAll(".pin").forEach(e => e.classList.remove("pin")); }
  function tile(m, rule) {
    const x = h("button", (m.verdict === "ok" ? "ok" : m.verdict === "miss" ? "miss" : "x") + (m.wrong ? " off" : ""), GLYPH[m.verdict]);
    x.type = "button";
    x.setAttribute("aria-label", HEAD[m.verdict] + ": " + m.line);
    x.addEventListener("mouseenter", e => { if (!pinned && !drag) { fillTip(m, rule); placeTip(e.clientX, e.clientY); } });
    x.addEventListener("mousemove", e => { if (!pinned && !drag) placeTip(e.clientX, e.clientY); });
    x.addEventListener("mouseleave", () => { if (!pinned) tip.hidden = true; });
    x.addEventListener("click", e => {
      e.stopPropagation();
      const again = pinned === m.id;
      unpin();
      if (again) return;
      pinned = m.id; x.classList.add("pin"); tip.classList.add("pinned");
      fillTip(m, rule);
      const r = x.getBoundingClientRect(); placeTip(r.left, r.bottom - 10);
    });
    return x;
  }
  document.addEventListener("click", e => { if (pinned && !e.target.closest("#tip")) unpin(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") unpin(); });

  // Every version's marks in one row, newest version on the left, each older one after a line and its label.
  function marksRow(f, ruleId) {
    const o = h("div", "xs"), now = latest(f);
    let any = false;
    for (const ver of [...f.versions].reverse()) {
      const list = moms(f, ver.v, ruleId);
      if (!list.length) continue;
      any = true;
      const seg = h("div", "vseg" + (ver.v === now ? "" : " old"));
      if (ver.v !== now) seg.append(h("span", "vlab", "v" + ver.v));
      for (const m of list) seg.append(tile(m, f.rules.find(r => r.id === m.rule)));
      o.append(seg);
    }
    return {row: o, any};
  }

  // ---------- health: one word per rule, worked out from its marks before and after the last edit ----------
  // now: the rule's marks on the file as it is today. before: its marks on the newest older version that has any.
  const tally = list => { const live = list.filter(m => !m.wrong); return {bad: live.filter(m => m.verdict !== "ok").length, all: live.length}; };
  // The whole vocabulary, four words, worked out by the server from each rule's marks (see status in harness_doctor.py):
  //   regression: a bad use on the rule as it is written now, and it was clean before its last edit
  //   failing:    a bad use on the rule as it is written now
  //   healthy:    used as it is written now, with no bad use
  //   no data:    no use as it is written now
  const STATUS = {worse: "Regression", bad: "Failing", good: "Healthy", none: "No data"};
  const health = (f, r) => ({key: r.status || "none", text: STATUS[r.status || "none"]});
  // ---------- one card per file, all on one level; the stripe's color says what kind of file it is ----------
  function summary(f) {  // the only status above a rule: how many of the file's rules are in each bad status, else one word
    const hs = f.rules.map(r => health(f, r)), cnt = k => hs.filter(x => x.key === k).length, out = h("span", "sum");
    if (cnt("worse")) out.append(h("span", "st worse", cnt("worse") + (cnt("worse") === 1 ? " regression" : " regressions")));
    if (cnt("bad")) out.append(h("span", "sm bad", cnt("bad") + " failing"));
    if (!out.children.length) { const k = cnt("good") ? "good" : "none"; out.append(h("span", "sm " + k, STATUS[k])); }
    return out;
  }
  // A long row of tiles: press and drag slides it sideways, and the side that has more tiles fades out.
  const FADE = 36;
  function fade(el) {
    const more = el.scrollWidth - el.clientWidth - el.scrollLeft;
    el.style.setProperty("--fl", el.scrollLeft > 1 ? FADE + "px" : "0px");
    el.style.setProperty("--fr", more > 1 ? FADE + "px" : "0px");
    el.classList.toggle("scrolls", el.scrollWidth > el.clientWidth + 1);
  }
  const shown = new ResizeObserver(es => { for (const e of es) fade(e.target); });  // the tiles only take up room while the mouse is on the row
  let drag = null;  // the row being slid: {el, x, left, moved}
  function scrolls(el) {
    el.addEventListener("scroll", () => fade(el), {passive: true});
    el.addEventListener("mousedown", e => {
      if (e.button !== 0 || el.scrollWidth <= el.clientWidth + 1) return;
      drag = {el, x: e.clientX, left: el.scrollLeft, moved: false};
      e.preventDefault();  // no text selection, no focus jump while sliding
    });
    el.addEventListener("click", e => { if (el.dataset.slid) { e.stopPropagation(); e.preventDefault(); delete el.dataset.slid; } }, true);  // a slide isn't a click on a tile
    shown.observe(el);
    return el;
  }
  document.addEventListener("mousemove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) < 4) return;
    if (!drag.moved) {  // the row stays open while it slides, even if the mouse leaves it
      drag.moved = true; drag.el.classList.add("dragging"); drag.el.closest(".rr").classList.add("sliding");
      if (!pinned) tip.hidden = true;
    }
    drag.el.scrollLeft = drag.left - dx;
  });
  document.addEventListener("mouseup", () => {
    if (!drag) return;
    const el = drag.el;
    if (drag.moved) { el.dataset.slid = "1"; setTimeout(() => { delete el.dataset.slid; }, 0); }
    el.classList.remove("dragging"); el.closest(".rr").classList.remove("sliding");
    drag = null;
  });
  function marksOf(f, r) {  // the rule's marks, newest wording first; they show while the mouse is on the rule
    const out = h("span", "marks"), eps = [...r.epochs].reverse(), mine = MOMENTS.filter(m => m.rule === r.id);
    const with_ = eps.filter(ep => mine.some(m => m.e === ep.e)), last = eps[0].e;
    for (const ep of with_) {  // an older wording is named by the day it was replaced
      const next = r.epochs.find(x => x.e === ep.e + 1);
      const old = ep.e !== last;
      if (!out.children.length && old) out.append(h("span", "vlat", "no data on latest"));  // only older wordings have marks
      if (!old && with_.length > 1) out.append(h("span", "vlat", "latest"));  // only the newest wording keeps its word
      if (old) {
        const sep = h("span", "vsep"), say = "before " + (next ? next.when : "");
        sep.addEventListener("mouseenter", e => { if (!pinned && !drag) { tip.replaceChildren(h("div", null, say)); tip.hidden = false; placeTip(e.clientX, e.clientY); } });
        sep.addEventListener("mousemove", e => { if (!pinned && !drag) placeTip(e.clientX, e.clientY); });
        sep.addEventListener("mouseleave", () => { if (!pinned) tip.hidden = true; });
        out.append(sep);
      }  // a line, no words: the date shows on hover
      for (const m of mine.filter(m => m.e === ep.e)) { const t = tile(m, r); if (old) t.classList.add("old"); out.append(t); }
    }
    return scrolls(out);
  }
  // ---------- History: the file's edits, newest first, each with what it did to the rules ----------
  const ruleOpen = new Set();
  const views = new Map(), hopen = new Map();  // per file: "rules" or "history"; per edit: "diff" or "file" when open
  const cellKey = list => { const t = tally(list); return !t.all ? "none" : t.bad ? "bad" : "good"; };
  const fileText = f => { let g = null, out = ""; for (const r of f.rules) { if (r.group !== g) { g = r.group; out += (out ? "\n" : "") + "## " + g + "\n"; } out += "- **" + r.title + ".** " + r.text + "\n"; } return out; };
  function historyOf(f) {
    const out = h("div", "hist"), now = latest(f);
    f.versions.forEach((ver, i) => {
      // What this edit did: each rule's result on this version against its last result before it.
      const res = {broke: [], fixed: [], still: [], first: [], good: 0};
      for (const r of f.rules) {
        const cur = cellKey(moms(f, ver.v, r.id));
        if (cur === "none") continue;
        const prev = f.versions.slice(0, i).reverse().map(o => cellKey(moms(f, o.v, r.id))).find(k => k !== "none");
        if (cur === "bad") (prev === "good" ? res.broke : prev === "bad" ? res.still : res.first).push(r.title);
        else if (prev === "bad") res.fixed.push(r.title);
        else res.good++;
      }
      const t = tally(moms(f, ver.v, null)), e = h("div", "he" + (ver.v === now ? " now" : "")), top = h("div", "htop"), key = f.id + "@" + ver.v, mode = hopen.get(key);
      top.append(h("b", null, ver.base ? "Before the logs" : ver.when + " edit"), h("span", "meta", (ver.v === now ? "latest" : "v" + ver.v) + " · " + (t.all ? t.bad + " bad of " + t.all + " uses" : "no uses yet")), h("span", "sp"));
      e.append(top);
      const outcome = [["broke", "Regression", res.broke], ["fixed", "Fixed", res.fixed], ["still", "Failing", res.still], ["first", "Failing", res.first]];
      const cards = h("div", "hcards");  // one small card per rule this edit touched
      for (const [cls, label, names] of outcome) for (const name of names) {
        const cd = h("div", "hc " + cls);
        cd.append(h("span", "hk", label), h("span", "hv", name));
        cards.append(cd);
      }
      if (cards.children.length) e.append(cards);
      if (!res.broke.length && !res.fixed.length && !res.still.length && !res.first.length)
        e.append(h("div", "meta", t.all ? "No rule had a bad use on this version." : "No session has used this version yet."));
      // The diff shows right away, cut after a few lines; "full" shows all of it, "file" shows the source file instead.
      const lines = (ver.diff || (ver.base ? "The file as it was before the first edit in the logs." : "The logs don't show what this edit changed.")).split("\n");
      const CUT = 4, long = lines.length > CUT, pre = h("pre", mode === "file" ? "src" : long && mode !== "full" ? "cut" : "");
      if (mode === "file") {  // the file as it was in this version, fetched when asked for
        pre.textContent = "Loading…";
        fetch("/api/text?file=" + encodeURIComponent(f.id) + "&v=" + ver.v).then(r => r.text()).then(t => { pre.textContent = t; }).catch(() => { pre.textContent = "Couldn't load it."; });
      } else for (const line of mode === "full" ? lines : lines.slice(0, CUT)) pre.append(h("span", line[0] === "+" ? "a" : line[0] === "-" ? "d" : "", line));
      const acts = h("div", "hacts"), set = k => () => { mode === k ? hopen.delete(key) : hopen.set(key, k); render(); };
      if (long && mode !== "file") { const b = h("button", "mini", mode === "full" ? "Show less" : "Show full diff (" + lines.length + " lines)"); b.type = "button"; b.addEventListener("click", set("full")); acts.append(b); }
      const sb = h("button", "mini", mode === "file" ? "Back to the diff" : "Show source file");
      sb.type = "button"; sb.addEventListener("click", set("file"));
      acts.append(sb);
      top.append(acts);  // the two buttons sit on the edit's top line, above the diff
      e.append(pre);
      out.prepend(e);  // newest first
    });
    return out;
  }
  // The hover card of a rule: its bad uses on the file as it is now, one line each, then how it did before.
  // full (after a click): each bad use also shows your words and Claude's, and can be called wrong.
  function ruleTip(f, r, st, full) {
    tip.replaceChildren();
    const head = h("div", "thead"), now = latest(f), cur = moms(f, now, r.id), bad = cur.filter(m => m.verdict !== "ok"), good = cur.length - bad.length;
    head.append(h("b", st.key === "good" ? "okc" : st.key === "none" ? "nonec" : null, st.text), h("span", "tdate", "since the " + f.versions[f.versions.length - 1].when + " edit"));
    tip.append(head, h("div", "rname", r.title));
    for (const m of bad) {
      const ln = h("div", "ml" + (m.wrong ? " off" : ""));
      ln.append(h("span", "mt", m.line), h("span", "tdate", m.when + " · " + m.project));
      tip.append(ln);
      if (!full) continue;
      if (m.you) { const q = h("div", "say"); q.append(h("span", "who", "You"), marked(m.you, m.marks)); tip.append(q); }
      if (m.claude) { const q = h("div", "say"); q.append(h("span", "who", "Claude"), marked(m.claude, m.cmarks)); tip.append(q); }
      const acts = h("div", "tacts"), w = h("button", "mini", m.wrong ? "Undo: it did go wrong" : "This didn't go wrong"), o = h("button", "mini", "Open this session");
      w.addEventListener("click", () => { m.wrong = !m.wrong; unpin(); render(); });
      o.addEventListener("click", () => { o.textContent = "Copied: claude --resume " + m.sid; });
      acts.append(w, o);
      tip.append(acts);
    }
    if (!cur.length) tip.append(h("div", "meta", "No use on the file as it is now."));
    else if (good) tip.append(h("div", "meta", (bad.length ? "and " : "") + good + (good === 1 ? " good use" : " good uses")));
    for (const ver of [...f.versions].reverse().slice(1)) {
      const t = tally(moms(f, ver.v, r.id));
      if (t.all) tip.append(h("div", "meta", "Before, on v" + ver.v + ": " + (t.bad ? t.bad + " bad of " + t.all : "clean in " + t.all) + (t.all === 1 ? " use" : " uses")));
    }
    tip.hidden = false;
  }
  function fileCard(f) {
    const on = open.has(f.id), c = h("div", "fc " + KC[f.kind]), hd = h("button", "fhd"), left = h("span", "fl");
    hd.type = "button";
    left.append(h("span", "nm", f.display || (/\.md$/.test(f.name) ? f.name : f.name + ".md")), h("span", "sub", f.label || (f.kind === "note" ? "domain knowledge" : f.kind)));
    hd.append(left, summary(f));
    hd.addEventListener("click", () => { on ? open.delete(f.id) : open.add(f.id); render(); });
    c.append(hd);
    if (!on) return c;
    const body = h("div", "rl"), view = views.get(f.id) || "rules", sw = h("div", "sw");
    for (const [k, label] of [["rules", "Rules"], ["history", "History"]]) {
      const b = h("button", "swb" + (view === k ? " on" : ""), label);
      b.type = "button";
      b.addEventListener("click", () => { views.set(f.id, k); render(); });
      sw.append(b);
    }
    body.append(sw);
    if (view === "history") { body.append(historyOf(f)); c.append(body); return c; }
    let group = null, list = null;
    for (const r of f.rules) {
      if (r.group !== group) { group = r.group; list = h("div", "gl"); body.append(h("div", "glab", group), list); }  // a plain label, never folded
      const st = health(f, r), row = h("div", "rr s-" + st.key);
      row.append(h("span", "dot d-" + st.key), h("span", "tname", r.title), marksOf(f, r));  // the tiles show while the mouse is on the rule
      if (st.key === "worse") {  // hover the word to see the edit that broke it
        const pill = h("span", "st worse", "Regression"), ver = f.versions[f.versions.length - 1];
        pill.addEventListener("mouseenter", e => {
          if (pinned) return;
          tip.replaceChildren(h("div", "rl2", "What the " + ver.when + " edit changed"));
          const pre = h("pre");
          for (const line of ver.diff.split("\n")) pre.append(h("span", line[0] === "+" ? "a" : line[0] === "-" ? "d" : "", line));
          tip.append(pre); tip.hidden = false; placeTip(e.clientX, e.clientY);
        });
        pill.addEventListener("mouseleave", () => { if (!pinned) tip.hidden = true; });
        row.append(pill);
      }
      const rk = f.id + "/" + r.id;  // click a rule to read the text that defines it
      row.classList.add("clk"); row.tabIndex = 0; row.setAttribute("role", "button");
      const flip = () => { ruleOpen.has(rk) ? ruleOpen.delete(rk) : ruleOpen.add(rk); tip.hidden = true; render(); };
      row.addEventListener("click", flip);
      row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
      list.append(row);
      if (ruleOpen.has(rk)) {
        row.classList.add("opened");
        const box = h("div", "rtext");
        box.append(h("div", null, r.text));
        list.append(box);
      }
    }
    c.append(body);
    return c;
  }
  function gapCard(g, i) {
    const c = h("div", "card k-gaps"), left = h("div"), o = h("div", "xs");
    left.append(h("div", "nm", g.topic), h("div", "sub", g.moments.length + " sessions"));
    for (const m of g.moments) o.append(tile(m, null));
    c.append(left, o);
    c.addEventListener("click", e => { if (e.target.closest(".more")) return; gapOpen.has(i) ? gapOpen.delete(i) : gapOpen.add(i); render(); });
    if (gapOpen.has(i)) {
      const more = h("div", "more"), head = h("div", "fhead"), cp = h("button", "pill", "Copy prompt");
      cp.type = "button";
      cp.addEventListener("click", () => { cp.textContent = "Copied ✓"; });
      head.append(h("h3", null, "Paste into Claude Code to work out where the fix belongs"), cp);
      more.append(head);
      c.append(more);
    }
    return c;
  }
  // A problem's scope: one project when every moment happened there, else everything.
  const gapScope = g => { const ps = [...new Set(g.moments.map(m => m.project))]; return ps.length === 1 && FILES.some(f => f.scope === ps[0]) ? ps[0] : ""; };
  // "Not covered yet" is the last card of its scope: a file that doesn't exist yet, with one row per problem.
  function gapsCard(sc, gaps) {
    const id = "gaps:" + sc, on = open.has(id), c = h("div", "fc k-gap"), hd = h("button", "fhd"), left = h("span", "fl"), sum = h("span", "sum");
    hd.type = "button";
    left.append(h("span", "nm", "Not covered yet"), h("span", "sub", "went wrong in 2 or more sessions, and nothing you wrote is about it"));
    sum.append(h("span", "sm gap", gaps.length + (gaps.length === 1 ? " problem" : " problems")));
    hd.append(left, sum);
    hd.addEventListener("click", () => { on ? open.delete(id) : open.add(id); render(); });
    c.append(hd);
    if (!on) return c;
    const body = h("div", "rl"), list = h("div", "gl");
    list.style.marginTop = "10px";
    for (const g of gaps) {
      const row = h("div", "rr"), marks = scrolls(h("span", "marks"));
      for (const m of g.moments) marks.append(tile(m, null));  // the tiles show while the mouse is on the problem
      row.append(h("span", "dot d-gap"), h("span", "tname", g.topic), marks, h("span", "sm none", g.moments.length + " sessions"));
      list.append(row);
    }
    body.append(list);
    c.append(body);
    return c;
  }
  // What shows: the levels that hold everywhere are always there; a project's group only when it's picked.
  const GENERAL = ["", "Shared", "Every project"];
  const scopeLabel = sc => sc === "" ? "Everything" : GENERAL.includes(sc) ? sc : "Project: " + sc;
  const hasMarks = f => MOMENTS.some(m => m.file === f.id);
  const showEmpty = new Set();
  let pick = "";
  function fillPicker() {
    const sel = $("scope"), projects = [...new Set(FILES.map(f => f.scope || ""))].filter(sc => !GENERAL.includes(sc)).sort();
    const inUse = projects.filter(p => ACTIVE.includes(p));
    const add = (v, t) => { const o = h("option", null, t); o.value = v; sel.append(o); };
    sel.replaceChildren();
    add("", "Everything");
    for (const p of inUse) add(p, p);  // only the projects in use
    if (projects.length > inUse.length) add("*", "Show all " + projects.length + " projects");
    sel.value = pick;
    sel.onchange = () => { pick = sel.value; render(); };
  }
  function render() {
    const box = $("cards");
    box.replaceChildren();
    if (!JUDGED) {
      const e = h("div", "empty", "No sessions judged yet. Press ");
      e.append(h("b", null, "Judge"), " to have Claude read your latest sessions against what you wrote.");
      box.append(e);
      return;
    }
    const scopes = [...new Set(FILES.map(f => f.scope || ""))].filter(sc => GENERAL.includes(sc) || pick === "*" || sc === pick)
      .sort((a, b) => (GENERAL.indexOf(a) + 9) % 9 - (GENERAL.indexOf(b) + 9) % 9 || a.localeCompare(b));
    for (const sc of scopes) {
      const files = FILES.filter(f => (f.scope || "") === sc).sort((a, b) => ORDER[a.kind] - ORDER[b.kind]);
      const quiet = files.filter(f => !hasMarks(f)), gaps = GAPS.filter(g => gapScope(g) === sc);
      box.append(h("div", "group", scopeLabel(sc)));
      for (const f of files) if (hasMarks(f) || showEmpty.has(sc)) box.append(fileCard(f));
      if (gaps.length) box.append(gapsCard(sc, gaps));
      if (quiet.length) {  // files nothing was judged on stay folded away
        const b = h("button", "fold", showEmpty.has(sc) ? "Hide the " + quiet.length + " with no data" : "Show " + quiet.length + " more with no data");
        b.type = "button";
        b.addEventListener("click", () => { showEmpty.has(sc) ? showEmpty.delete(sc) : showEmpty.add(sc); render(); });
        box.append(b);
      }
    }
  }
  // The one prompt for the whole page: every regression, failing rule and uncovered problem, worst first.
  $("fixall").addEventListener("click", async () => {
    const inView = sc => GENERAL.includes(sc) || pick === "*" || sc === pick;
    const hs = FILES.filter(f => inView(f.scope || "")).flatMap(f => f.rules.map(r => r.status)), n = k => hs.filter(x => x === k).length;
    const gaps = GAPS.filter(g => inView(gapScope(g))).length, parts = [];
    if (n("worse")) parts.push(n("worse") + (n("worse") === 1 ? " regression" : " regressions"));
    if (n("bad")) parts.push(n("bad") + " failing " + (n("bad") === 1 ? "rule" : "rules"));
    if (gaps) parts.push(gaps + " not covered yet");
    const seen = new Set(MOMENTS.map(m => m.rule)), idle = FILES.filter(f => inView(f.scope || "")).flatMap(f => f.rules).filter(r => !seen.has(r.id)).length;
    if (idle && JUDGED) parts.push(idle + (idle === 1 ? " unused rule" : " unused rules"));
    const cmd = "/harness-doctor:fix" + (pick && pick !== "*" ? " " + pick : "");
    try { await navigator.clipboard.writeText(cmd); $("fixall").textContent = "Copied ✓"; } catch (e) { $("fixall").textContent = cmd; }
    $("msg").textContent = parts.length
      ? "Paste it into Claude Code. It goes through " + parts.join(", ").replace(/, ([^,]*)$/, " and $1") + ", worst first, one at a time."
      : "Nothing to fix right now.";
    setTimeout(() => { $("fixall").textContent = "Copy fix prompt"; }, 1500);
    clearTimeout(window.msgT); window.msgT = setTimeout(() => { $("msg").textContent = ""; }, 6000);
  });

  // ---------- loading and judging ----------
  function paintJudge(busy, text) {
    const b = $("judge"), p = PENDING;
    b.hidden = !busy && !p.count;
    b.disabled = !!busy;
    b.textContent = busy ? "Judging…" : "Judge " + p.batch + (p.count > p.batch ? " of " + p.count : "") + " new " + (p.batch === 1 ? "session" : "sessions");
    b.title = busy ? "" : "Calls Claude on your login, two runs per session: about $" + p.cost.toFixed(2) + " of usage.";
    $("jmsg").textContent = text != null ? text : !p.count && JUDGED ? "Every session is judged." : "";
  }
  async function load() {
    let d;
    try { d = await (await fetch("/api/data")).json(); }
    catch (e) { $("jmsg").textContent = "Couldn't reach the Harness Doctor server. Is it still running?"; return false; }
    FILES = d.files; MOMENTS = d.moments; GAPS = d.gaps; ACTIVE = d.active; PENDING = d.pending; JUDGED = d.judged;
    fillPicker(); render();
    return true;
  }
  async function poll() {
    let j;
    try { j = await (await fetch("/api/status")).json(); } catch (e) { paintJudge(false, "Lost the server while judging."); return; }
    if (j.state === "running") { paintJudge(true, j.message); setTimeout(poll, 1500); return; }
    await load();
    paintJudge(false, j.state === "idle" ? null : j.message);
  }
  $("judge").addEventListener("click", async () => {
    paintJudge(true, "Starting…");
    try { await fetch("/api/doctor", {method: "POST", headers: {"X-Harness-Doctor": "1"}}); } catch (e) {}
    poll();
  });
  const q = new URLSearchParams(location.hash.slice(1));  // #scope=<project>&open=<file id>&history=<file id> opens the page in that state
  if (q.get("scope")) pick = q.get("scope");
  $("jmsg").textContent = "Reading your sessions…";
  load().then(ok => {
    if (!ok) return;
    for (const id of (q.get("open") || "").split(",")) if (fileOf(id) || id.startsWith("gaps:")) open.add(id);
    for (const id of (q.get("history") || "").split(",")) if (fileOf(id)) { open.add(id); views.set(id, "history"); }
    render();
    poll();  // picks up a judge run that is already going
  });
})();
</script>
